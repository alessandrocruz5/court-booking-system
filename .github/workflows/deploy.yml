name: Deploy

# Builds both images, pushes them to Artifact Registry and deploys Cloud Run through Workload
# Identity Federation (no JSON keys). One-time GCP setup: docs/runbook.md → Cloud Run (once).
# Migrations never run here: the owner applies them from a laptop.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Deploys queue one at a time; a running deploy is never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped, not failed, until the owner sets the GitHub variables. Runs after a green CI run
    # of a push to main, or on manual dispatch (which the WIF condition limits to main).
    if: vars.GCP_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token that Workload Identity Federation exchanges
    env:
      REGION: asia-southeast1
      REGISTRY: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cb
      # Deploy exactly the commit CI tested, not whatever main points at now.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v4
      # Same GHA cache scopes as CI's `images` job, so these builds reuse its layers.
      # No provenance attestation: each tag is one plain image manifest, so Artifact Registry's
      # untagged-image cleanup has no attestation manifests to delete or to count.
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/web:${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/backend:${{ env.SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # Free-tier settings, shared by both services:
      # - Min 0 instances: scale to zero when idle, so an idle service costs nothing.
      # - Max 1 instance: a cost cap. One instance is plenty for a demo, and it halves the
      #   worst case under a traffic flood.
      # - Request-based billing: CPU is throttled outside requests (the default). Never pass
      #   --no-cpu-throttling, which bills for the instance's whole lifetime.
      # - --cpu-boost: extra CPU during startup only, to shorten cold starts.
      # Secrets come from Secret Manager (`:latest`), read by the cb-runtime service account.
      - name: Deploy cb-backend
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
          DEMO_VIEWER_EMAIL: ${{ vars.DEMO_VIEWER_EMAIL }}
        run: |
          BACKEND_HOST="${BACKEND_URL#https://}"
          gcloud run deploy cb-backend \
            --image "$REGISTRY/backend:$SHA" \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 40 \
            --cpu-boost \
            --timeout 60 \
            --service-account "cb-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --set-env-vars "ALLOWED_HOSTS=$BACKEND_HOST,CSRF_TRUSTED_ORIGINS=$BACKEND_URL,SITE_URL=$WEB_URL,DEMO_VIEWER_EMAIL=$DEMO_VIEWER_EMAIL" \
            --set-secrets "DJANGO_SECRET_KEY=cb-django-secret-key:latest,DATABASE_URL=cb-database-url:latest,INTERNAL_API_TOKEN=cb-internal-api-token:latest,PAYMONGO_SECRET_KEY=cb-paymongo-secret-key:latest,PAYMONGO_WEBHOOK_SECRET=cb-paymongo-webhook-secret:latest,DEMO_VIEWER_PASSWORD=cb-demo-viewer-password:latest" \
            --quiet
      - name: Deploy cb-web
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          gcloud run deploy cb-web \
            --image "$REGISTRY/web:$SHA" \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --cpu-boost \
            --service-account "cb-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --set-env-vars "API_URL=$BACKEND_URL,SITE_URL=$WEB_URL,DASHBOARD_URL=$BACKEND_URL/dashboard/" \
            --set-secrets "INTERNAL_API_TOKEN=cb-internal-api-token:latest" \
            --quiet
      # The nightly maintenance job on the backend image. Nothing schedules it until the unit that
      # adds the `nightly` command; a job costs nothing while it doesn't run.
      - name: Deploy cb-nightly
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          gcloud run jobs deploy cb-nightly \
            --image "$REGISTRY/backend:$SHA" \
            --region "$REGION" \
            --command python \
            --args manage.py,nightly \
            --tasks 1 \
            --max-retries 1 \
            --task-timeout 600 \
            --cpu 1 \
            --memory 512Mi \
            --service-account "cb-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --set-env-vars "ALLOW_DEMO_SEED=1,SITE_URL=$WEB_URL,ALLOWED_HOSTS=localhost" \
            --set-secrets "DJANGO_SECRET_KEY=cb-django-secret-key:latest,DATABASE_URL=cb-database-url:latest" \
            --quiet

      # Both health routes answer without touching the database, so this wakes no Neon compute.
      - name: Smoke check
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 "$BACKEND_URL/healthz"
          curl -fsS --retry 5 --retry-delay 5 "$WEB_URL/api/health"
