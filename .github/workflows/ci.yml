name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a push run: the secrets scan of a push covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Same database and host port as compose.yaml's `db`: the backend tests default to
      # postgres://postgres:postgres@localhost:54329/cb, so no TEST_DATABASE_URL is needed.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cb
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cb"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # setup-uv publishes immutable releases only (no major tags since v8), so it's pinned like gitleaks.
      # uv downloads the Python from apps/backend/.python-version itself.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
          # uv's own default. Turbo's strict env mode drops the UV_CACHE_DIR this action exports, so
          # uv inside `pnpm lint`/`pnpm test` writes here, and the post step saves this directory.
          cache-local-path: ~/.cache/uv
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # No env: settings and pages read variables per request, never at build time.
      - run: pnpm build

  # Builds both Cloud Run images with no build env and smoke-runs them. Nothing is pushed.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: cb-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: false
          load: true
          tags: cb-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Smoke web
        run: |
          docker run -d --name web -p 8080:8080 -e SITE_URL=http://localhost:8080 cb-web:ci
          for _ in $(seq 30); do
            curl -fsS localhost:8080/api/health && break
            sleep 1
          done
          curl -fsS localhost:8080/api/health
          curl -sI localhost:8080/ | grep -i '^content-security-policy:'
          uid="$(docker exec web id -u)"
          test "$uid" != 0
      - name: Smoke backend
        run: |
          # Throwaway values, generated per run and never committed.
          secret_key="$(python3 -c "import secrets;print(secrets.token_urlsafe(50))")"
          api_token="$(python3 -c "import secrets;print(secrets.token_urlsafe(30))")"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$api_token"
          # Every required key except DJANGO_SECRET_KEY. The database is never connected.
          env_args=(
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci
            -e ALLOWED_HOSTS=localhost
            -e CSRF_TRUSTED_ORIGINS=http://localhost:8081
            -e SITE_URL=http://localhost:8080
            -e INTERNAL_API_TOKEN="$api_token"
          )
          docker run -d --name backend -p 8081:8080 -e DJANGO_SECRET_KEY="$secret_key" "${env_args[@]}" cb-backend:ci
          for _ in $(seq 30); do
            curl -fsS localhost:8081/health && break
            sleep 1
          done
          curl -fsS localhost:8081/health
          uid="$(docker exec backend id -u)"
          test "$uid" != 0
          # Fail-fast env validation: without DJANGO_SECRET_KEY, gunicorn must exit non-zero at
          # once (124 would mean it kept running until the timeout) and name the missing key.
          rc=0
          output="$(timeout 30 docker run --rm "${env_args[@]}" cb-backend:ci 2>&1)" || rc=$?
          echo "$output"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "::error::backend did not refuse to start without DJANGO_SECRET_KEY (exit $rc)"
            exit 1
          fi
          grep -q 'missing or blank: DJANGO_SECRET_KEY' <<<"$output"
      - name: Container logs
        if: failure()
        run: |
          docker logs web || true
          docker logs backend || true

  # Fails when a pushed or PR commit adds a secret. It scans only those commits, not all history.
  # By then the secret is already on GitHub: rotate it anyway (runbook → Secret exposure).
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists the PR's commits to pick its scan range
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks walks the commit range, so it needs the history
      # Personal-account repo: no GITLEAKS_LICENSE needed. The token is read-only (PR commits, owner type).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The read-only token can't comment on PRs; findings go to the job summary instead.
          GITLEAKS_ENABLE_COMMENTS: "false"
